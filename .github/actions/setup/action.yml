name: Setup
description: Install pnpm (version from package.json "packageManager"), Node.js and workspace dependencies.
inputs:
  node-version:
    description: Node.js version to install.
    default: "22"
runs:
  using: composite
  steps:
    - uses: pnpm/setup@v3
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true
        install: false
    - run: pnpm install --frozen-lockfile
      shell: bash
