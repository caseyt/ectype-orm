name: Setup
description: Install pnpm (version from package.json "packageManager"), Node.js and workspace dependencies.
inputs:
  node-version:
    description: Node.js version to install.
    default: "20"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
